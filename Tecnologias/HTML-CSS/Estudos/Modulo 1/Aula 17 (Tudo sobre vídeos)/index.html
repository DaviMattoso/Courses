<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocando vídeos no HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FOR THE HORDE</h1>
    <img src="img/2d.png" alt="For the horde">
    <p>Pega minha rainha <3</p>
    <video src="Video/Forthehorde.mp4" width="320" height="240" autoplay></video>
     Para permitir que o usuário controle a reprodução:
    <video src="Video/Forthehorde.mp4" width="320" height="240" controls autoplay></video>
     Para colocar uma thumbnail no vídeo:
     <video src="Video/Forthehorde.mp4" width="320" height="240" controls autoplay poster="img/thumb.png"></video>
     Video linkado do youtube (iframe):
     <iframe src="https://www.youtube.com/embed/jSJr3dXZfcg" width="560" height="315" frameborder="0" allowfullscreen></iframe>
</body>
</html>
